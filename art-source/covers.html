<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Covers: Baccarat Simulator, Just Baccarat</title>
<!--Box art for the two Baccarat apps, in the manner of a late-90s casino CD-ROM: gold arched title, ribbon, light rays, sparkle, a collage of cards and chips, feature seals.
Each .cover is 630 x 500 and is rendered at 2x into assets/ (see README)-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Michroma&display=block">
<style>
	:root {
		--gold-1: #fff6c9;
		--gold-2: #f0c757;
		--gold-3: #a66d12;
		--gold-4: #5a3606;
		--red: #c3162a;
		--black: #141416;
		--card: #fffdf6;
	}

	* {
		box-sizing: border-box;
	}

	body {
		margin: 0;
		padding: 20px;
		display: flex;
		flex-wrap: wrap;
		gap: 20px;
		background: #222222;
	}

	.cover {
		position: relative;
		width: 630px;
		height: 500px;
		overflow: hidden;
		font-family: 'Cinzel', Georgia, serif;
	}

	/*Light rays from behind the title*/
	.rays {
		position: absolute;
		left: 50%;
		top: 150px;
		width: 1200px;
		height: 1200px;
		margin: -600px 0 0 -600px;
		background: repeating-conic-gradient(rgba(255, 230, 160, 0.13) 0 5deg, transparent 5deg 14deg);
		-webkit-mask: radial-gradient(circle, #000000 0, rgba(0, 0, 0, 0.6) 25%, transparent 55%);
		mask: radial-gradient(circle, #000000 0, rgba(0, 0, 0, 0.6) 25%, transparent 55%);
	}

	/*Casino lights, out of focus*/
	.bokeh {
		position: absolute;
		inset: 0;
		background:
			radial-gradient(circle at 8% 22%, rgba(255, 210, 120, 0.55) 0 7px, transparent 18px),
			radial-gradient(circle at 16% 9%, rgba(255, 120, 120, 0.4) 0 10px, transparent 24px),
			radial-gradient(circle at 92% 14%, rgba(255, 220, 140, 0.5) 0 9px, transparent 22px),
			radial-gradient(circle at 84% 30%, rgba(140, 190, 255, 0.35) 0 6px, transparent 16px),
			radial-gradient(circle at 96% 44%, rgba(255, 200, 120, 0.4) 0 12px, transparent 28px),
			radial-gradient(circle at 4% 48%, rgba(255, 160, 90, 0.35) 0 9px, transparent 22px),
			radial-gradient(circle at 26% 34%, rgba(255, 240, 200, 0.3) 0 4px, transparent 11px),
			radial-gradient(circle at 74% 6%, rgba(255, 240, 200, 0.35) 0 5px, transparent 13px);
	}

	/*A four-pointed glint*/
	.glint {
		position: absolute;
		width: 70px;
		height: 70px;
		margin: -35px 0 0 -35px;
		background: radial-gradient(circle, #ffffff 0 3px, rgba(255, 250, 220, 0.6) 5px, transparent 14px), linear-gradient(90deg, transparent 0 46%, rgba(255, 255, 255, 0.9) 50%, transparent 54%), linear-gradient(0deg, transparent 0 46%, rgba(255, 255, 255, 0.9) 50%, transparent 54%);
		-webkit-mask: radial-gradient(circle, #000000 20%, transparent 70%);
		mask: radial-gradient(circle, #000000 20%, transparent 70%);
		z-index: 4;
	}

	/*The platform strip across the top, as on a CD-ROM box*/
	.strip {
		position: absolute;
		left: 0;
		right: 0;
		top: 0;
		height: 30px;
		display: flex;
		align-items: center;
		justify-content: space-between;
		padding: 0 12px;
		background: linear-gradient(180deg, #2a2a2e, #050506);
		border-bottom: 2px solid var(--gold-2);
		color: #ffffff;
		font: 11px/1 'Michroma', sans-serif;
		letter-spacing: 0.12em;
		z-index: 5;
	}

	.strip img {
		height: 22px;
	}

	.title {
		position: absolute;
		left: 0;
		top: 26px;
		width: 630px;
		height: 190px;
		overflow: visible;
	}

	/*Ribbon banner*/
	.ribbon {
		position: absolute;
		left: 50%;
		transform: translateX(-50%);
		filter: drop-shadow(0 5px 5px rgba(0, 0, 0, 0.6));
		z-index: 3;
	}

	.ribbon .band {
		position: relative;
		padding: 8px 34px 7px;
		background: linear-gradient(180deg, #e8293e 0%, var(--red) 45%, #7d0c19 100%);
		border-top: 2px solid var(--gold-2);
		border-bottom: 2px solid var(--gold-2);
		color: var(--gold-1);
		font: 900 26px/1 'Cinzel', Georgia, serif;
		letter-spacing: 0.22em;
		white-space: nowrap;
		text-shadow: 0 2px 0 #4a0710;
	}

	.ribbon::before,
	.ribbon::after {
		content: '';
		position: absolute;
		top: 9px;
		width: 34px;
		height: 100%;
		background: #8a0d1c;
		z-index: -1;
	}

	.ribbon::before {
		left: -24px;
		clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 34% 50%);
	}

	.ribbon::after {
		right: -24px;
		clip-path: polygon(0 0, 100% 0, 66% 50%, 100% 100%, 0 100%);
	}

	/*Cards*/
	.card {
		position: absolute;
		width: 124px;
		height: 174px;
		border-radius: 10px;
		background: linear-gradient(155deg, #ffffff, var(--card) 45%, #e8ddc0);
		box-shadow: 0 12px 22px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(0, 0, 0, 0.2);
		color: var(--black);
	}

	.card.red {
		color: var(--red);
	}

	.card .corner {
		position: absolute;
		top: 8px;
		left: 9px;
		display: flex;
		flex-direction: column;
		align-items: center;
		font: 900 27px/0.9 'Cinzel', Georgia, serif;
	}

	.card .corner small {
		font: 21px/1 'Segoe UI Symbol', 'DejaVu Sans', sans-serif;
	}

	.card .corner.flip {
		top: auto;
		left: auto;
		bottom: 8px;
		right: 9px;
		transform: rotate(180deg);
	}

	.card .pip {
		position: absolute;
		inset: 0;
		display: grid;
		place-items: center;
		font: 84px/1 'Segoe UI Symbol', 'DejaVu Sans', sans-serif;
	}

	/*A court card: a framed panel in red, gold and blue, with the rank large*/
	.card .court {
		position: absolute;
		inset: 26px 22px;
		display: grid;
		place-items: center;
		border: 2px solid currentColor;
		border-radius: 4px;
		background: repeating-linear-gradient(45deg, rgba(240, 199, 87, 0.28) 0 4px, transparent 4px 9px), linear-gradient(180deg, rgba(31, 79, 170, 0.18), rgba(195, 22, 42, 0.14));
		font: 900 74px/1 'Cinzel', Georgia, serif;
		text-shadow: 2px 2px 0 rgba(240, 199, 87, 0.9);
	}

	/*Chips: ellipses seen from above at an angle, their edges stacked below*/
	.chip {
		position: absolute;
		width: 96px;
		height: 42px;
		border-radius: 50%;
		background: radial-gradient(ellipse at center, #f6f1e2 0 30%, var(--c) 31% 39%, #f6f1e2 40% 42%, transparent 43%), repeating-conic-gradient(var(--c) 0 22deg, #f6f1e2 22deg 34deg, var(--c) 34deg 45deg);
		box-shadow: 0 6px 0 var(--edge), 0 8px 6px rgba(0, 0, 0, 0.5), inset 0 0 0 2px rgba(0, 0, 0, 0.18);
	}

	.chip b {
		position: absolute;
		inset: 0;
		display: grid;
		place-items: center;
		color: var(--c);
		font: 900 22px/1 'Cinzel', Georgia, serif;
		transform: scaleY(0.46);
	}

	/*A chip lying flat toward us, face on*/
	.chip.flat {
		width: 74px;
		height: 74px;
		box-shadow: 0 4px 0 var(--edge), 0 8px 10px rgba(0, 0, 0, 0.5), inset 0 0 0 2px rgba(0, 0, 0, 0.18);
	}

	.chip.flat b {
		transform: none;
		font-size: 19px;
	}

	/*Three figures need a smaller face*/
	.chip b.wide {
		font-size: 14px;
	}

	.green {
		--c: #1f8a4c;
		--edge: #0f4d29;
	}

	.red-chip {
		--c: #c8202f;
		--edge: #6d0f18;
	}

	.black-chip {
		--c: #26262b;
		--edge: #0c0c0e;
	}

	.purple {
		--c: #6b2bb8;
		--edge: #36145f;
	}

	/*A gold seal with a claim on it*/
	.seal {
		position: absolute;
		width: 104px;
		height: 104px;
		display: grid;
		place-items: center;
		border-radius: 50%;
		background: radial-gradient(circle at 35% 30%, var(--gold-1), var(--gold-2) 40%, var(--gold-3) 100%);
		box-shadow: 0 0 0 3px var(--gold-4), 0 0 0 5px var(--gold-2), 0 8px 14px rgba(0, 0, 0, 0.6);
		color: #3a1d02;
		font: 900 14px/1.1 'Cinzel', Georgia, serif;
		text-align: center;
		letter-spacing: 0.04em;
		z-index: 3;
	}

	.seal big {
		display: block;
		font-size: 26px;
	}

	.burst {
		position: absolute;
		filter: drop-shadow(0 5px 6px rgba(0, 0, 0, 0.55));
		z-index: 3;
	}

	/*Baccarat Simulator: red velvet and gold*/
	#bs {
		background: radial-gradient(ellipse 75% 60% at 50% 32%, #b31c2e 0%, #6d0a17 45%, #2a0308 100%);
	}

	/*Just Baccarat: emerald, black and gold*/
	#jb {
		background: radial-gradient(ellipse 75% 60% at 50% 32%, #12814a 0%, #07472a 45%, #01170c 100%);
	}

	/*Its features, on a black and gold panel*/
	.features {
		position: absolute;
		padding: 10px 14px 10px 12px;
		background: linear-gradient(180deg, rgba(10, 10, 12, 0.92), rgba(30, 24, 10, 0.92));
		border: 2px solid var(--gold-2);
		border-radius: 6px;
		box-shadow: 0 8px 14px rgba(0, 0, 0, 0.6);
		color: var(--gold-1);
		font: 700 13px/1.55 'Cinzel', Georgia, serif;
		letter-spacing: 0.03em;
		z-index: 3;
	}

	.features div::before {
		content: '\2726  ';
		color: var(--gold-2);
	}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
	<defs>
		<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff8d6"/>
			<stop offset="0.35" stop-color="#f6d06a"/>
			<stop offset="0.55" stop-color="#b47a16"/>
			<stop offset="0.75" stop-color="#f3c95c"/>
			<stop offset="1" stop-color="#8a5a0c"/>
		</linearGradient>
		<filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
			<feGaussianBlur stdDeviation="6" result="blur"/>
			<feFlood flood-color="#ffd98a" flood-opacity="0.55"/>
			<feComposite in2="blur" operator="in" result="halo"/>
			<feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
		</filter>
		<path id="arch" d="M 40 150 Q 315 40 590 150"/>
	</defs>
</svg>

<!--Baccarat Simulator-->
<div class="cover" id="bs">
	<div class="rays"></div>
	<div class="bokeh"></div>
	<div class="strip"><span>MOBILE &nbsp;·&nbsp; CARD GAME</span><img src="../assets/logo.webp" alt=""></div>

	<!--The title: gold capitals on an arch, extruded in darker gold, with a glow-->
	<svg class="title" viewBox="0 0 630 190" aria-hidden="true">
		<g font-family="Cinzel, Georgia, serif" font-weight="900" font-size="92" letter-spacing="2" text-anchor="middle">
			<text fill="#3a1d02" transform="translate(0 7)"><textPath href="#arch" startOffset="50%">BACCARAT</textPath></text>
			<text fill="#5a3606" transform="translate(0 5)"><textPath href="#arch" startOffset="50%">BACCARAT</textPath></text>
			<text fill="#7d4c0a" transform="translate(0 3)"><textPath href="#arch" startOffset="50%">BACCARAT</textPath></text>
			<text fill="url(#gold)" stroke="#4a2a04" stroke-width="3" paint-order="stroke" stroke-linejoin="round" filter="url(#glow)"><textPath href="#arch" startOffset="50%">BACCARAT</textPath></text>
		</g>
	</svg>
	<div class="glint" style="left:520px;top:92px"></div>
	<div class="glint" style="left:118px;top:150px;transform:scale(0.6)"></div>
	<div class="ribbon" style="top:186px"><div class="band">SIMULATOR</div></div>

	<div class="chip green" style="left:44px;top:428px"></div>
	<div class="chip green" style="left:44px;top:420px"></div>
	<div class="chip green" style="left:44px;top:412px"><b>25</b></div>
	<div class="chip black-chip" style="left:120px;top:440px"></div>
	<div class="chip black-chip" style="left:120px;top:432px"><b>100</b></div>
	<div class="chip flat red-chip" style="left:470px;top:410px;transform:rotate(-12deg)"><b>5</b></div>
	<div class="chip flat purple" style="left:530px;top:380px;transform:rotate(18deg)"><b class="wide">500</b></div>

	<div class="card" style="left:168px;top:280px;transform:rotate(-22deg)">
		<div class="corner">A<small>♠&#xFE0E;</small></div><div class="pip">♠&#xFE0E;</div><div class="corner flip">A<small>♠&#xFE0E;</small></div>
	</div>
	<div class="card red" style="left:232px;top:258px;transform:rotate(-8deg)">
		<div class="corner">K<small>♥&#xFE0E;</small></div><div class="court">K</div><div class="corner flip">K<small>♥&#xFE0E;</small></div>
	</div>
	<div class="card" style="left:300px;top:256px;transform:rotate(7deg)">
		<div class="corner">9<small>♣&#xFE0E;</small></div><div class="pip">♣&#xFE0E;</div><div class="corner flip">9<small>♣&#xFE0E;</small></div>
	</div>
	<div class="card red" style="left:366px;top:276px;transform:rotate(21deg)">
		<div class="corner">Q<small>♦&#xFE0E;</small></div><div class="court">Q</div><div class="corner flip">Q<small>♦&#xFE0E;</small></div>
	</div>
	<div class="glint" style="left:346px;top:262px;transform:scale(0.8)"></div>

	<div class="seal" style="left:22px;top:262px;transform:rotate(-10deg)"><span>TIE PAYS<big>8 TO 1</big></span></div>
	<svg class="burst" style="left:500px;top:236px;width:116px;height:116px;transform:rotate(12deg)" viewBox="-64 -64 128 128" aria-hidden="true">
		<polygon class="star" fill="#ffd400" stroke="#8a0d1c" stroke-width="3"/>
		<text text-anchor="middle" font-family="Michroma, sans-serif" font-size="16" fill="#8a0d1c" y="-4">NO</text>
		<text text-anchor="middle" font-family="Michroma, sans-serif" font-size="26" fill="#8a0d1c" y="23">BS!</text>
	</svg>
</div>

<!--Just Baccarat-->
<div class="cover" id="jb">
	<div class="rays"></div>
	<div class="bokeh"></div>
	<div class="strip"><span>MOBILE &nbsp;·&nbsp; CARD GAME</span><img src="../assets/logo.webp" alt=""></div>

	<div class="ribbon" style="top:44px"><div class="band" style="font-size:20px;padding:6px 30px 5px">JUST</div></div>
	<svg class="title" style="top:44px" viewBox="0 0 630 190" aria-hidden="true">
		<g font-family="Cinzel, Georgia, serif" font-weight="900" font-size="92" letter-spacing="2" text-anchor="middle">
			<text fill="#1f1202" transform="translate(0 7)"><textPath href="#arch" startOffset="50%">BACCARAT</textPath></text>
			<text fill="#5a3606" transform="translate(0 5)"><textPath href="#arch" startOffset="50%">BACCARAT</textPath></text>
			<text fill="#7d4c0a" transform="translate(0 3)"><textPath href="#arch" startOffset="50%">BACCARAT</textPath></text>
			<text fill="url(#gold)" stroke="#3a2003" stroke-width="3" paint-order="stroke" stroke-linejoin="round" filter="url(#glow)"><textPath href="#arch" startOffset="50%">BACCARAT</textPath></text>
		</g>
	</svg>
	<div class="glint" style="left:110px;top:160px"></div>
	<div class="glint" style="left:508px;top:132px;transform:scale(0.7)"></div>

	<div class="features" style="left:22px;top:250px">
		<div>Punto Banco rules</div>
		<div>Pair bets</div>
		<div>Bead Plate &amp; Big Road</div>
		<div>Plays offline</div>
	</div>

	<div class="card red" style="left:268px;top:262px;transform:rotate(-14deg)">
		<div class="corner">K<small>♥&#xFE0E;</small></div><div class="court">K</div><div class="corner flip">K<small>♥&#xFE0E;</small></div>
	</div>
	<div class="card" style="left:350px;top:250px;transform:rotate(6deg)">
		<div class="corner">9<small>♣&#xFE0E;</small></div><div class="pip">♣&#xFE0E;</div><div class="corner flip">9<small>♣&#xFE0E;</small></div>
	</div>
	<div class="glint" style="left:452px;top:262px;transform:scale(0.8)"></div>

	<div class="chip red-chip" style="left:500px;top:444px"></div>
	<div class="chip red-chip" style="left:500px;top:436px"></div>
	<div class="chip red-chip" style="left:500px;top:428px"><b>5</b></div>
	<div class="chip green" style="left:516px;top:396px"></div>
	<div class="chip green" style="left:516px;top:388px"></div>
	<div class="chip green" style="left:516px;top:380px"></div>
	<div class="chip green" style="left:516px;top:372px"><b>25</b></div>
	<div class="chip flat black-chip" style="left:200px;top:420px;transform:rotate(-14deg)"><b class="wide">100</b></div>
	<div class="chip flat purple" style="left:120px;top:432px;transform:rotate(10deg)"><b class="wide">500</b></div>
</div>

<script>
	//The starbursts' points
	for (const star of document.querySelectorAll('.star')) {
		const points = [];

		for (let i = 0; i < 32; i++) {
			const radius = i % 2 ? 46 : 62;
			const angle = i / 32 * Math.PI * 2;
			points.push(`${(Math.cos(angle) * radius).toFixed(1)},${(Math.sin(angle) * radius).toFixed(1)}`);
		}

		star.setAttribute('points',points.join(' '));
	}
</script>
</body>
</html>
